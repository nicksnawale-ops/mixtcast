<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Left Waveform Bars -->
  <g class="waveform-left" fill="#FF5A1F">
    <rect x="100" y="80" width="6" height="24" rx="3" />
    <rect x="114" y="68" width="6" height="48" rx="3" />
    <rect x="128" y="52" width="6" height="80" rx="3" />
    <rect x="142" y="64" width="6" height="56" rx="3" />
    <line x1="90" y1="92" x2="160" y2="92" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Center Circle & Play Button -->
  <g class="center-mark">
    <!-- Orange Outer Circle -->
    <circle cx="200" cy="92" r="42" fill="none" stroke="#FF5A1F" stroke-width="7" />
    <!-- Navy Play Triangle -->
    <polygon points="190,72 190,112 222,92" fill="#0E3B8C" stroke="#0E3B8C" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Right Waveform Bars -->
  <g class="waveform-right" fill="#FF5A1F">
    <line x1="240" y1="92" x2="310" y2="92" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" />
    <rect x="252" y="64" width="6" height="56" rx="3" />
    <rect x="266" y="52" width="6" height="80" rx="3" />
    <rect x="280" y="68" width="6" height="48" rx="3" />
    <rect x="294" y="80" width="6" height="24" rx="3" />
  </g>

  <!-- Wordmark -->
  <g class="wordmark" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="44" letter-spacing="1">
    <text x="200" y="196">
      <tspan fill="#0E3B8C">MIXT</tspan><tspan fill="#FF5A1F">CAST</tspan>
    </text>
  </g>

  <!-- Sub-line -->
  <g class="subline" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="14.5" fill="#1F2328" letter-spacing="7">
    <text x="200" y="232">VISUAL SOLUTIONS PVT. LTD</text>
  </g>
</svg>
